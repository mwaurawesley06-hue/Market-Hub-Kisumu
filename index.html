<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MPIDS — Market Price Information Distribution System</title>
    <meta name="description" content="MPIDS — verified commodity market prices for traders, farmers and buyers. Market Info Hub, Kisumu.">
    <link rel="icon" href="img/favicon.png">
    <link rel="manifest" href="pwa/manifest.json">
    <meta name="theme-color" content="#0b2b1b">
</head>
<body>
    <p>Taking you to the <a href="public-dashboard.html">public price dashboard</a>.
       Super Admins can continue to the <a href="login.html">login page</a>.</p>
    <noscript>
        <p><a href="public-dashboard.html">Continue to the public price dashboard</a> or
           <a href="login.html">log in to the admin area</a>.</p>
    </noscript>
    <script>
        // Signed-in admins land on the dashboard; everyone else on the public dashboard.
        (function () {
            if (localStorage.getItem('mpids_user')) {
                fetch(window.location.pathname.replace(/[^/]*$/, '') + 'api/stats/', { credentials: 'include' })
                    .then(function (res) {
                        window.location.href = res.ok ? 'dashboard.html' : 'public-dashboard.html';
                    })
                    .catch(function () { window.location.href = 'public-dashboard.html'; });
            } else {
                window.location.href = 'public-dashboard.html';
            }
        })();
    </script>
</body>
</html>
