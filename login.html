<body class="login-body">
<main class="login-page">
    <div class="login-brand"><div class="brand-mark"><img src="img/logo.png" alt="MPIDS logo" data-brand-logo></div><div><strong data-brand-name>MPIDS</strong><span data-brand-tagline>Market Info Hub, Kisumu</span></div></div>
    <section class="login-card market-accent-login">
        <div class="login-photo" aria-hidden="true" data-brand-hero data-hero-fallback="img/market-hero.jpg"></div>
        <div class="login-form-side">
            <div class="eyebrow">Secure workspace</div><h1>Welcome back</h1><p>Sign in to capture, review, and publish market prices.</p><form id="login-form" novalidate><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="admin@mpids.local" required><span class="field-error" data-error-for="email"></span></div><div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><span class="field-error" data-error-for="password"></span></div><button class="button button-primary" type="submit" id="login-submit"><i class="fa-solid fa-arrow-right-to-bracket"></i><span>Sign in</span></button></form><p class="form-hint">Static demo build: any email and password opens the demo admin shell. Live accounts, approvals and SMS need the PHP/MySQL backend.</p>
        </div>
    </section>
    <p class="login-footer"><a href="public-dashboard.html">Browse public prices</a> Â· No account required</p>
</main>
