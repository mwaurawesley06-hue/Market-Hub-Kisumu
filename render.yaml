# Render blueprint: PHP web service connected to an EXTERNAL MySQL database.
# Render only offers managed Postgres/Redis, so host MySQL elsewhere for free
# (recommended: TiDB Cloud Starter, MySQL-compatible — see RENDER_SETUP.md).
# Copy your database's connection URL into DATABASE_URL below, then deploy
# this service from the `backend` branch of the repository.
services:
  - type: web
    name: mpids-api
    runtime: php
    plan: free
    buildCommand: "composer install --no-dev --no-interaction"
    startCommand: "php -S 0.0.0.0:$PORT router.php"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MPIDS_DB_SSL
        value: "1"
      - key: MPIDS_DB_SSL_VERIFY
        sync: false
      - key: CORS_ORIGIN
        value: "https://mwaurawesley06-hue.github.io"
      - key: MPIDS_APP_NAME
        value: "MPIDS"
      - key: APP_TIMEZONE
        value: "Africa/Nairobi"
      - key: PHP_VERSION
        value: "8.2"
